<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bonds · Comunidad</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>

  <nav class="navbar">
    <a href="comunidad.html" class="logo">Star<span>Bonds</span></a>
    <ul class="nav-links">
      <li><a href="comunidad.html">Comunidad</a></li>
      <li><a href="marketplace.html">Marketplace</a></li>
      <li><a href="actividad.html">Actividad</a></li>
      <li><a href="perfil.html">Perfil</a></li>
    </ul>
  </nav>

  <main class="contenedor-estrecho">
    <h1 class="titulo-pagina">Comunidad</h1>
    <p class="subtitulo">Comparte tu arte y descubre el de otros.</p>

    <!-- Compositor -->
    <div class="tarjeta">
      <div class="compositor">
        <span class="avatar avatar-md" id="comp-avatar">🎨</span>
        <div style="flex:1">
          <textarea id="comp-texto" placeholder="¿En qué estás trabajando hoy?"></textarea>
          <div class="compositor-acciones">
            <div class="compositor-iconos">
              <button class="icono-btn" title="Imagen" type="button" onclick="elegirEmoji()">🖼️</button>
              <button class="icono-btn" title="Collab" type="button" onclick="marcarCollab()">🤝</button>
            </div>
            <button class="btn btn-primario btn-sm" onclick="publicar()">Publicar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Pestañas For you / Following -->
    <div class="tabs" data-grupo="feed">
      <button class="tab activo" data-tab="foryou">Para ti</button>
      <button class="tab" data-tab="following">Siguiendo</button>
    </div>

    <section data-panel="foryou" data-grupo="feed" class="tab-panel activo">
      <div class="feed" id="feed-foryou"></div>
    </section>
    <section data-panel="following" data-grupo="feed" class="tab-panel">
      <div class="feed" id="feed-following"></div>
    </section>
  </main>

  <footer class="footer">© 2026 StarBonds · Bonds</footer>

  <script src="app.js"></script>
  <script>
    const perfil = Object.assign({}, USUARIO_ACTUAL, Estado.get("perfil", {}));
    document.getElementById("comp-avatar").textContent = perfil.emoji;

    let nuevoEmoji = null;   // imagen elegida para el post nuevo
    let esCollab = false;
    const likes = Estado.get("likes", {});

    function publicacionHTML(p) {
      const a = USUARIOS[p.autor] || perfil;
      const nombre = a.nombre || perfil.nombre;
      const usuario = a.usuario || perfil.usuario;
      const emoji = a.emoji || perfil.emoji;
      const liked = likes[p.id];
      const totalLikes = (p.likes || 0) + (liked ? 1 : 0);
      const enlace = USUARIOS[p.autor] ? `usuario.html?id=${p.autor}` : "perfil.html";
      return `
        <article class="tarjeta publicacion">
          <a href="${enlace}">${avatarHTML(emoji, "avatar-md")}</a>
          <div class="contenido">
            <div class="encabezado">
              <a href="${enlace}" class="nombre" style="text-decoration:none;color:var(--texto)">${nombre}</a>
              <span class="usuario">${usuario}</span>
              <span class="tiempo">· ${p.tiempo}</span>
              ${p.collab ? '<span class="tag" style="margin-left:auto">🤝 Collab</span>' : ""}
            </div>
            <p class="texto">${p.texto}</p>
            ${p.emoji ? `<div class="imagen">${p.emoji}</div>` : ""}
            <div class="acciones-post">
              <button onclick="like('${p.id}', this)" class="${liked ? "activo" : ""}">
                <span>${liked ? "❤️" : "🤍"}</span> <span class="contador">${totalLikes}</span>
              </button>
              <button>💬 ${p.comentarios || 0}</button>
              <button onclick="toast('Post compartido 🔗')">🔁 Compartir</button>
            </div>
          </div>
        </article>`;
    }

    function pintarFeeds() {
      const propios = Estado.get("misPublicaciones", []);
      const todos = [...propios, ...POSTS];
      document.getElementById("feed-foryou").innerHTML = todos.map(publicacionHTML).join("");
      const siguiendo = Estado.get("siguiendo", []);
      const following = todos.filter((p) => p.autor === "yo" || p.following || siguiendo.includes(p.autor));
      document.getElementById("feed-following").innerHTML = following.length
        ? following.map(publicacionHTML).join("")
        : `<p class="muted center" style="padding:40px 0">Aún no sigues a nadie. Ve al <a href="comunidad.html" class="link-violeta">feed Para ti</a> y empieza a seguir artistas.</p>`;
    }

    function like(id, btn) {
      likes[id] = !likes[id];
      Estado.set("likes", likes);
      btn.classList.toggle("activo", likes[id]);
      btn.querySelector("span").textContent = likes[id] ? "❤️" : "🤍";
      const c = btn.querySelector(".contador");
      const base = (POSTS.find((p) => p.id === id)?.likes) ?? 0;
      c.textContent = base + (likes[id] ? 1 : 0);
    }

    function elegirEmoji() {
      const opciones = ["🎨", "🖼️", "📷", "🎼", "🗿", "✍️", "🌅", "🔥"];
      nuevoEmoji = opciones[Math.floor(Math.random() * opciones.length)];
      toast("Imagen añadida " + nuevoEmoji);
    }
    function marcarCollab() { esCollab = !esCollab; toast(esCollab ? "Marcado como collab 🤝" : "Collab quitado"); }

    function publicar() {
      const texto = document.getElementById("comp-texto").value.trim();
      if (!texto) { toast("Escribe algo primero ✍️"); return; }
      const propios = Estado.get("misPublicaciones", []);
      propios.unshift({
        id: "yo" + Date.now(),
        autor: "yo",
        texto,
        emoji: nuevoEmoji,
        collab: esCollab,
        likes: 0,
        comentarios: 0,
        tiempo: "ahora",
        following: true,
      });
      Estado.set("misPublicaciones", propios);
      document.getElementById("comp-texto").value = "";
      nuevoEmoji = null; esCollab = false;
      pintarFeeds();
      toast("¡Publicado! 🎉");
    }

    pintarFeeds();
  </script>
</body>
</html>
